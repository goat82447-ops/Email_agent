# Render Blueprint for the InboxAgent dashboard.
# Deploy: push this repo to GitHub, then in Render click
# "New +" > "Blueprint" and select this repo. Fill the secret env vars below
# (they are marked sync:false so Render prompts you and never stores them in git).
services:
  - type: web
    name: inbox-agent
    runtime: docker
    plan: free
    dockerfilePath: ./InboxAgent/Dockerfile
    dockerContext: ./InboxAgent
    envVars:
      - key: Inbox__EmailAddress
        sync: false
      - key: Inbox__AppPassword
        sync: false
      - key: Delivery__SenderEmail
        sync: false
      - key: Delivery__SenderAppPassword
        sync: false
      - key: Delivery__RecipientEmail
        sync: false
      - key: OpenAi__ApiKey
        sync: false
